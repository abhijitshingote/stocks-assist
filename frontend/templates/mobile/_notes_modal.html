<div class="wl-modal-overlay" id="notesModalOverlay">
  <div class="wl-modal notes-sheet">
    <div class="wl-modal-title">Abi ticker notes for <span class="ticker-hl" id="notesModalTicker"></span></div>
    <div class="ticker-notes-view" id="notesModalView"></div>
    <textarea id="notesModalNotes" placeholder="Abi ticker notes (markdown supported)…"></textarea>
    <div class="notes-sheet-foot">
      <div class="wl-modal-actions ticker-notes-actions">
        <button class="wl-remove" id="notesModalRemoveBtn" style="display:none" type="button">Delete</button>
        <button class="wl-cancel" type="button" id="notesModalCancelBtn">Cancel</button>
        <button class="wl-save" id="notesModalSaveBtn" type="button">Save</button>
      </div>
      <span class="notes-sheet-head-actions">
        <button type="button" class="notes-edit-btn" id="notesModalEditBtn">Edit</button>
        <button type="button" class="notes-sheet-close" id="notesModalCloseBtn" aria-label="Close notes">&times;</button>
      </span>
    </div>
  </div>
</div>

<div class="wl-modal-overlay" id="dlModalOverlay">
  <div class="wl-modal dl-theme">
    <div class="wl-modal-title" id="dlModalTitleEl">Block <span class="ticker-hl" id="dlModalTicker"></span> from screeners</div>
    <div class="dl-kind-row" id="dlKindRow">
      <label class="dl-kind-opt"><input type="radio" name="dlKind" value="temporary" checked> 30 days</label>
      <label class="dl-kind-opt"><input type="radio" name="dlKind" value="permanent"> Permanent</label>
    </div>
    <textarea id="dlModalNotes" placeholder="Why are you blocking this? (optional)"></textarea>
    <div class="wl-modal-actions">
      <button class="wl-remove" id="dlModalRemoveBtn" style="display:none" type="button">Remove</button>
      <button class="wl-cancel" id="dlModalCancelBtn" type="button">Cancel</button>
      <button class="wl-save dl-save" id="dlModalSaveBtn" type="button">Block</button>
    </div>
  </div>
</div>
