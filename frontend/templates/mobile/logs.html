{% extends "mobile/_shell.html" %}
{% set page_title = 'Logs' %}
{% set page_libs = ['master-detail'] %}
{% block title %}Logs — Mobile{% endblock %}
{% block content %}
  <div class="utility-body md-layout" id="logsLayout">
    <div class="md-list-pane">
      <div class="md-toolbar">
        <span class="md-item-meta" id="logCount">—</span>
        <span class="spacer"></span>
        <button type="button" class="md-btn" id="btnRefreshList">Refresh</button>
        <button type="button" class="md-btn" id="btnAutoRefresh">Auto</button>
      </div>
      <div class="md-list" id="logList"></div>
    </div>
    <div class="md-detail-pane">
      <div class="md-detail-head">
        <button type="button" class="md-back" data-md-back>← List</button>
        <span class="md-detail-title" id="currentLogName">—</span>
        <button type="button" class="md-btn" id="btnScrollTop">Top</button>
        <button type="button" class="md-btn" id="btnScrollBottom">End</button>
      </div>
      <div class="log-viewer" id="logContent">
        <div class="md-empty">Select a log file</div>
      </div>
    </div>
  </div>
{% endblock %}
{% block page_scripts %}
<script src="{{ url_for('static', filename='js/mobile/pages/logs.js') }}"></script>
{% endblock %}
