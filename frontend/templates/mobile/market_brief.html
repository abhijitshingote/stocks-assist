{% extends "mobile/_shell.html" %}
{% set page_title = 'Market Brief' %}
{% block title %}Market Brief — Mobile{% endblock %}
{% block content %}
  <div class="utility-body md-layout" id="briefLayout">
    <div class="md-chip-strip" id="dateStrip"></div>
    <div class="md-toolbar">
      <span class="md-detail-title" id="currentBriefDate">—</span>
      <span class="spacer"></span>
      <button type="button" class="md-btn primary" id="btnRun">Generate</button>
      <button type="button" class="md-btn" id="btnPdf" disabled>PDF</button>
      <button type="button" class="md-btn" id="btnLosers">Losers</button>
    </div>
    <div id="runProgressBanner"></div>
    <div class="brief-content-area" id="briefContent">
      <div class="md-loading">Loading…</div>
    </div>
  </div>
{% endblock %}
{% block page_scripts %}
<script src="{{ url_for('static', filename='js/mobile/pages/market-brief.js') }}"></script>
{% endblock %}
